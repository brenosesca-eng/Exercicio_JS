<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - 12 - JS</title>
    <script>
        var A = Number(prompt('Qual o valor A?') );
        var B = Number(prompt('Qual o valor B?') );
        var C = Number(prompt('Qual o valor  C?') );
        var delta = B * B - 4 * A * C;
      

        if (A != 0 && delta >= 0){
            var baskara1 = (- B + Math.sqrt(delta) /2 *A );
            var baskara2 = (- B - Math.sqrt(delta) /2 *A );
            document.write ('Baskara 1 = ' + baskara1.toFixed (2) + '</br>');
            document.write( 'baskara2 =' + baskara2.toFixed (2));
        }else{
        document.write('Impossível calcular');
        }
          
    </script>
</head>
<body>
    
</body>
</html>

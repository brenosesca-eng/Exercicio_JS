<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - 10 - JS</title>
</head>
<script>
     var meses = prompt('Qual dia que você deseja saber?');

    switch (meses){
        case '28':
        document.write( ' Os mês que tem 28 dias é: Fevereiro ' )
        break
         case '30':
        document.write( ' Os meses que tem 30 dias são: Abril, Junho, Setembro e  Novembro ' )
        break
         case '31':
        document.write( 'Os mêses que tem 31 dias são: Janeiro, Março, Maio, Julho, Agosto, Outubro e Dezembro ' )
        break
        default:
            document.write('Fevereiro é o mês, mas apenas em ano bissexto')
    }
</script>

</body>
</html>
